
<!DOCTYPE html>  
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video på Canvas med Bootstrap 5</title>
    <!-- Bootstrap 5 CSS -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
 
    <!-- Bootstrap Icons -->
   <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <style>
        canvas {
            max-width: 100%;
            height: auto;
            background-color: #212529;
        }
        #torchContainer {
            display: none;
        }
    </style>
</head>
<body class="bg-light">

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            
            <div class="card shadow">
                <div class="card-header bg-primary text-white text-center py-3">
                    <h1 class="h4 mb-0"><i class="bi bi-camera-video-fill me-2"></i>Video Stream på Canvas</h1>
                </div>
                
                <div class="card-body p-3 text-center">
                    <canvas id="canvas" width="640" height="480" class="rounded border border-secondary shadow-sm mb-4"></canvas>
                    
                    <div class="d-flex flex-wrap justify-content-center align-items-center gap-3">
                        <button id="startBtn" class="btn btn-success px-4 py-2 shadow-sm">
                            <i class="bi bi-play-fill me-1"></i> Start
                        </button>
                        <button id="stopBtn" class="btn btn-danger px-4 py-2 shadow-sm" disabled>
                            <i class="bi bi-stop-fill me-1"></i> Stop
                        </button>

                        <div  id="torchContainer" class="form-check form-switch bg-dark text-white rounded px-3 py-2 ms-2 shadow-sm align-middle d-inline-flex align-items-center gap-2 d-none">
                            <input class="form-check-input ms-0" type="checkbox" role="switch" id="torchSwitch">
                            <label class="form-check-label ps-1 user-select-none" for="torchSwitch">
                                <i id="torchIcon" class="bi bi-lightbulb"></i> 
                            </label>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </div>
</div>

<video id="video" autoplay playsinline style="display:none;"></video>

   <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>


<script>
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const startBtn = document.getElementById('startBtn');
    const stopBtn = document.getElementById('stopBtn');
    const torchContainer = document.getElementById('torchContainer');
    const torchSwitch = document.getElementById('torchSwitch');
    const torchIcon = document.getElementById('torchIcon');

    let mediaStream = null;
    let videoTrack = null; // Ændret fra track til videoTrack for klarhed
    let isRunning = false;

    function tick() {
        if (!isRunning) return;

        if (video.readyState === video.HAVE_ENOUGH_DATA) {
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        }

        window.requestAnimationFrame(tick);
    }

    async function startStream() {
        try {
            const isTorchActive = torchSwitch.checked;

            const constraints = {
                video: {
                    facingMode: 'environment',
                    advanced: [{ torch: isTorchActive }]
                }
            };

            mediaStream = await navigator.mediaDevices.getUserMedia(constraints);
            video.srcObject = mediaStream;
            await video.play();

            // RETTELSE: Vi snupper det FØRSTE element i arrayet af videotrack
            const tracks = mediaStream.getVideoTracks();
            if (tracks.length > 0) {
                videoTrack = tracks[0];
            }

            // Tjek support for torch på det specifikke spor
            const capabilities = (videoTrack && videoTrack.getCapabilities) ? videoTrack.getCapabilities() : {};
            
            if (capabilities.torch) {
                torchContainer.style.setProperty('display', 'inline-flex', 'important');
                updateTorchUI(torchSwitch.checked);
            } else {
                console.log("Torch understøttes ikke på denne enhed.");
                torchContainer.style.setProperty('display', 'none', 'important');
            }

            isRunning = true;
            startBtn.disabled = true;
            stopBtn.disabled = false;

            window.requestAnimationFrame(tick);
        } catch (err) {
            console.error("Fejl ved start af kamera:", err);
            alert("Kunne ikke starte videostream. Tjek kameratilladelser.");
        }
    }

    async function toggleTorch() {
        if (!videoTrack || !isRunning) return;

        const shouldTurnOn = torchSwitch.checked;

        try {
            await videoTrack.applyConstraints({
                advanced: [{ torch: shouldTurnOn }]
            });
            updateTorchUI(shouldTurnOn);
        } catch (err) {
            console.error("Kunne ikke ændre torch state:", err);
            torchSwitch.checked = !shouldTurnOn;
        }
    }

    function updateTorchUI(isOn) {
        if (isOn) {
            torchIcon.className = "bi bi-lightbulb-fill text-warning";
            torchContainer.classList.replace('bg-dark', 'bg-warning-subtle');
            torchContainer.classList.replace('text-white', 'text-dark');
        } else {
            torchIcon.className = "bi bi-lightbulb text-secondary";
            torchContainer.classList.replace('bg-warning-subtle', 'bg-dark');
            torchContainer.classList.replace('text-dark', 'text-white');
        }
    }

    async function stopStream() {
        isRunning = false;

        // RETTELSE: Vi slukker og stopper nu korrekt på det specifikke spor
        if (videoTrack) {
            try {
                await videoTrack.applyConstraints({ advanced: [{ torch: false }] });
            } catch (e) {}
            videoTrack.stop();
            videoTrack = null;
        }

        if (mediaStream) {
            mediaStream.getTracks().forEach(t => t.stop());
            mediaStream = null;
        }

        video.srcObject = null;
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        startBtn.disabled = false;
        stopBtn.disabled = true;
        
        torchContainer.style.setProperty('display', 'none', 'important');
    }

    startBtn.addEventListener('click', startStream);
    stopBtn.addEventListener('click', stopStream);
    torchSwitch.addEventListener('change', toggleTorch);
</script>

</body>
</html>
