
<!DOCTYPE html>  
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video på Canvas med Bootstrap 5</title>
   <!-- <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script> -->



    <!-- Bootstrap 5 CSS -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
 
    <!-- Bootstrap Icons -->
   <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
   <style>
        canvas {
            max-width: 100%;
            height: auto;
            background-color: #212529;
        }
    </style>
</head>
<body class="bg-light">

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            
            <div class="card shadow">
                <div class="card-header bg-primary text-white text-center py-3">
                    <h1 class="h4 mb-0"><i class="bi bi-camera-video-fill me-2"></i>Video Stream på Canvas</h1>
                </div>
                
                <div class="card-body p-3 text-center">
                    <canvas id="canvas" width="640" height="480" class="rounded border border-secondary shadow-sm mb-4"></canvas>
                    
                    <div class="d-flex flex-wrap justify-content-center align-items-center gap-3">
                        <!-- Start-knap -->
                        <button id="startBtn" class="btn btn-success px-4 py-2 shadow-sm">
                            <i class="bi bi-play-fill me-1"></i> Start
                        </button>
                        
                        <!-- Stop-knap (skjult fra start) -->
                        <button id="stopBtn" class="btn btn-danger px-4 py-2 shadow-sm d-none">
                            <i class="bi bi-stop-fill me-1"></i> Stop
                        </button>

                        <!-- Torch ikon-knap uten tekst eller checkbox -->
                        <button id="torchBtn" class="btn btn-dark p-2 d-none shadow-sm rounded-circle" style="width: 42px; height: 42px;" title="Lommelygte">
                            <i id="torchIcon" class="bi bi-lightbulb"></i>
                        </button>
                    </div>
                </div>
            </div>

        </div>
    </div>
</div>

<video id="video" autoplay playsinline style="display:none;"></video>

   <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>


<script>
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const startBtn = document.getElementById('startBtn');
    const stopBtn = document.getElementById('stopBtn');
    const torchBtn = document.getElementById('torchBtn');
    const torchIcon = document.getElementById('torchIcon');

    let mediaStream = null;
    let videoTrack = null;
    let isRunning = false;
    let isTorchOn = false;
    let autoStopTimer = null; // Variabel til at holde styr på vores 5-minutters timer

    function tick() {
        if (!isRunning) return;

        if (video.readyState === video.HAVE_ENOUGH_DATA) {
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        }

        window.requestAnimationFrame(tick);
    }

    async function startStream() {
        try {
            const constraints = {
                video: {
                    facingMode: 'environment',
                    advanced: [{ torch: isTorchOn }]
                }
            };

            mediaStream = await navigator.mediaDevices.getUserMedia(constraints);
            video.srcObject = mediaStream;
            await video.play();

            const tracks = mediaStream.getVideoTracks();
            if (tracks.length > 0) {
                videoTrack = tracks[0];
            }

            const capabilities = (videoTrack && videoTrack.getCapabilities) ? videoTrack.getCapabilities() : {};
            
            if (capabilities.torch) {
                torchBtn.classList.remove('d-none');
                updateTorchUI();
            } else {
                console.log("Torch understøttes ikke på denne enhed.");
                torchBtn.classList.add('d-none');
            }

            isRunning = true;
            
            startBtn.classList.add('d-none');
            stopBtn.classList.remove('d-none');

            // NYT: Start 1-minutters timer til automatisk stop (1 * 60 * 1000 ms)
            autoStopTimer = setTimeout(() => {
                console.log("Automatisk stop aktiveret efter x minutter.");
                stopStream();
            }, 60000);

            window.requestAnimationFrame(tick);
        } catch (err) {
            console.error("Fejl ved start af kamera:", err);
            alert("Kunne ikke starte videostream. Tjek kameratilladelser.");
        }
    }

    async function toggleTorch() {
        if (!videoTrack || !isRunning) return;

        isTorchOn = !isTorchOn;

        try {
            await videoTrack.applyConstraints({
                advanced: [{ torch: isTorchOn }]
            });
            updateTorchUI();
        } catch (err) {
            console.error("Kunne ikke ændre torch state:", err);
            isTorchOn = !isTorchOn;
        }
    }

    function updateTorchUI() {
        if (isTorchOn) {
            torchIcon.className = "bi bi-lightbulb-fill text-dark";
            torchBtn.className = "btn btn-warning p-2 shadow-sm rounded-circle";
        } else {
            torchIcon.className = "bi bi-lightbulb text-secondary";
            torchBtn.className = "btn btn-dark p-2 shadow-sm rounded-circle";
        }
    }

    async function stopStream() {
        isRunning = false;

        // NYT: Ryd timeren, så den ikke forsøger at lukke et allerede lukket kamera ned senere
        if (autoStopTimer) {
            clearTimeout(autoStopTimer);
            autoStopTimer = null;
        }

        if (videoTrack) {
            try {
                await videoTrack.applyConstraints({ advanced: [{ torch: false }] });
            } catch (e) {}
            videoTrack.stop();
            videoTrack = null;
        }

        if (mediaStream) {
            mediaStream.getTracks().forEach(t => t.stop());
            mediaStream = null;
        }

        video.srcObject = null;
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        startBtn.classList.remove('d-none');
        stopBtn.classList.add('d-none');
        torchBtn.classList.add('d-none');
    }

    startBtn.addEventListener('click', startStream);
    stopBtn.addEventListener('click', stopStream);
    torchBtn.addEventListener('click', toggleTorch);
</script>

</body>
</html>
