<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <title>Video på Canvas med Lommelygte</title>
    <style>
        body { font-family: sans-serif; text-align: center; margin-top: 20px; }
        canvas { border: 2px solid #333; max-width: 100%; height: auto; display: block; margin: 10px auto; }
        button { padding: 10px 20px; font-size: 16px; margin: 5px; cursor: pointer; }
    </style>
</head>
<body>

    <h1>Video Stream på Canvas</h1>
    <div>
        <button id="startBtn">Start</button>
        <button id="stopBtn" disabled>Stop</button>
    </div>

    <video id="video" autoplay playsinline style="display:none;"></video>
    <canvas id="canvas" width="640" height="480"></canvas>

<script>
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const startBtn = document.getElementById('startBtn');
    const stopBtn = document.getElementById('stopBtn');

    let mediaStream = null;
    let track = null;
    let isRunning = false;

    function tick() {
        if (!isRunning) return;

        // Her kan du tilgå hver enkelt frame på lærredet eller direkte fra video-elementet
        if (video.readyState === video.HAVE_ENOUGH_DATA) {
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        }

        window.requestAnimationFrame(tick);
    }

    async function startStream() {
        try {
            // Anmod om kamera med bagudvendt foretrukket og forsøg at tænde torch
            const constraints = {
                video: {
                    facingMode: 'environment',
                    advanced: [{ torch: true }]
                }
            };

            mediaStream = await navigator.mediaDevices.getUserMedia(constraints);
            video.srcObject = mediaStream;
            await video.play();

            track = mediaStream.getVideoTracks()[0];

            // Tjek om torch rent faktisk blev tændt/understøttes
            const capabilities = track.getCapabilities ? track.getCapabilities() : {};
            if (!capabilities.torch) {
                console.log("Torch (lommelygte) understøttes ikke på denne enhed.");
            }

            isRunning = true;
            startBtn.disabled = true;
            stopBtn.disabled = false;

            window.requestAnimationFrame(tick);
        } catch (err) {
            console.error("Fejl ved start af kamera:", err);
            alert("Kunne ikke starte videostream.");
        }
    }

    async function stopStream() {
        isRunning = false;

        if (track) {
            // Sluk torch før sporet lukkes (hvis understøttet)
            try {
                await track.applyConstraints({ advanced: [{ torch: false }] });
            } catch (e) {
                // Ignorer fejl ved slukning af torch
            }
            track.stop();
        }

        if (mediaStream) {
            mediaStream.getTracks().forEach(t => t.stop());
        }

        video.srcObject = null;
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        startBtn.disabled = false;
        stopBtn.disabled = true;
    }

    startBtn.addEventListener('click', startStream);
    stopBtn.addEventListener('click', stopStream);
</script>

</body>
</html>
