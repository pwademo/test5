<!DOCTYPE html>
<html lang="da">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scanner</title>


    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <style>
        canvas {
            max-width: 100%;
            height: auto;
            background-color: #212529;
        }

        /* Container til at placere den røde søger-ramme oven på video-canvas */
        .canvas-container {
            position: relative;
            display: inline-block;
            max-width: 100%;
        }

        /* Den visuelle røde scanner-ramme i midten */
        .scanner-target {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            border: 3px solid #dc3545;
            box-shadow: 0 0 10px rgba(220, 53, 69, 0.5);
            pointer-events: none;
            display: none;
        }
    </style>



</head>

<body class="bg-light">
 <div class="container py-4">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">

                <!-- NYT KORT: Vælg Scannings-motor -->
                <div class="card shadow mb-4">
                    <div class="card-body p-3">
                        <label for="engineSelect" class="form-label fw-bold small text-secondary text-uppercase mb-2">
                            <i class="bi bi-gear-wide-connected me-1"></i> Vælg Scannings-motor
                        </label>
                        <select id="engineSelect" class="form-select form-select-lg border-primary shadow-sm">
                            <!-- Option-elementer genereres dynamisk via JavaScript -->
                        </select>
                    </div>
                </div>

                <!-- 1. Hovedkort: Video Stream -->
                <div class="card shadow mb-4">
                    <div class="card-header bg-primary text-white text-center py-3">
                        <h1 class="h4 mb-0"><i class="bi bi-camera-video-fill me-2"></i>Video Stream på Canvas</h1>
                    </div>

                    <div class="card-body p-3 text-center">
                        <div class="canvas-container mb-4">
                            <canvas id="canvas" width="640" height="480"
                                class="rounded border border-secondary shadow-sm"></canvas>
                            <div id="scannerTarget" class="scanner-target"></div>
                        </div>

                        <div class="d-flex flex-wrap justify-content-center align-items-center gap-3">
                            <button id="startBtn" class="btn btn-success px-4 py-2 shadow-sm">
                                <i class="bi bi-play-fill me-1"></i> Start
                            </button>

                            <button id="stopBtn" class="btn btn-danger px-4 py-2 shadow-sm d-none">
                                <i class="bi bi-stop-fill me-1"></i> Stop
                            </button>

                            <button id="torchBtn" class="btn btn-dark p-2 d-none shadow-sm rounded-circle"
                                style="width: 42px; height: 42px;" title="Lommelygte">
                                <i id="torchIcon" class="bi bi-lightbulb"></i>
                            </button>
                        </div>
                    </div>
                </div>

                <!-- 2. Kort: Forstørret Scanner-felt -->
                <div class="card shadow border-danger mb-4">
                    <div class="card-header bg-danger text-white text-center py-2">
                        <h2 class="h5 mb-0"><i class="bi bi-zoom-in me-2"></i>Forstørret Scanner-felt</h2>
                    </div>
                    <div class="card-body p-3 text-center bg-dark rounded-bottom">
                        <canvas id="zoomCanvas" class="rounded border border-light shadow-sm"></canvas>
                    </div>
                </div>

                <!-- NYT KORT: Scanningsresultat -->
                <div class="card shadow border-success">
                    <div class="card-header bg-success text-white py-2 d-flex justify-content-between align-items-center">
                        <h2 class="h5 mb-0"><i class="bi bi-qr-code-scan me-2"></i>Scanningsresultat</h2>
                        <button id="clearResultBtn" class="btn btn-sm btn-outline-light py-0 px-2" style="font-size: 0.8rem;">
                            <i class="bi bi-trash3-fill"></i> Ryd
                        </button>
                    </div>
                    <div class="card-body p-3 bg-white rounded-bottom">
                        <div id="resultOutput" class="alert alert-secondary mb-0 p-3 text-center border-dashed font-monospace" style="border: 2px dashed #dee2e6; min-height: 60px;">
                            <em>Venter på scanning...</em>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <video id="video" autoplay playsinline style="display:none;"></video>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
   
   

<script>
        // #region CONFIG & VARIABLER
       
// Centralt konfigurationsobjekt til nem tilpasning
        const CONFIG = {
            mainCanvasWidth: 640,    // Bredde på primær kilde-canvas
            mainCanvasHeight: 480,   // Højde på primær kilde-canvas
            targetWidth: 320,        // Læse felt i scanner-felt
            targetHeight: 40,        // Lavere scanner-felt (ca. 1/2 af før)
            zoomFactor: 2.5,         // Forhøjet forstørrelse for bedre læsbarhed
            autoStopTimeMS: 300000,  // Timeout (5 minutter = 300.000 ms)
            facingMode: 'environment',// Bruger bagsidekamera
            minContrast: 40          // Minimum acceptabel kontrast (0-255) til fremtidig OCR
        };

        console.log("[Kamera-Log] Scriptet er indlæst med CONFIG:", CONFIG);

        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        const zoomCanvas = document.getElementById('zoomCanvas');
        const zoomCtx = zoomCanvas.getContext('2d');
        const scannerTarget = document.getElementById('scannerTarget');

        const startBtn = document.getElementById('startBtn');
        const stopBtn = document.getElementById('stopBtn');
        const torchBtn = document.getElementById('torchBtn');
        const torchIcon = document.getElementById('torchIcon');

        // Nye elementer til dropdown og resultatvisning
        const engineSelect = document.getElementById('engineSelect');
        const resultOutput = document.getElementById('resultOutput');
        const clearResultBtn = document.getElementById('clearResultBtn');

        let mediaStream = null;
        let videoTrack = null;
        let isRunning = false;
        let isTorchOn = false;
        let autoStopTimer = null;
        let tickCounter = 0;

        // Initialiser dimensioner ud fra CONFIG
        canvas.width = CONFIG.mainCanvasWidth;
        canvas.height = CONFIG.mainCanvasHeight;

        // Omregner pixels til procent af hoved-canvas for den røde rammes CSS overlay
        scannerTarget.style.width = ((CONFIG.targetWidth / CONFIG.mainCanvasWidth) * 100) + '%';
        scannerTarget.style.height = ((CONFIG.targetHeight / CONFIG.mainCanvasHeight) * 100) + '%';

        // Tilpas zoomCanvas-størrelsen dynamisk baseret på CONFIG udklip * zoomfaktor
        zoomCanvas.width = CONFIG.targetWidth * CONFIG.zoomFactor;
        zoomCanvas.height = CONFIG.targetHeight * CONFIG.zoomFactor;

        // #endregion






        // #region SCANNER MANAGER (MOTOR-STYRING)
        const ScannerManager = {
            engines: {},
            activeEngineKey: null,

            // Registrer en ny scannings-motor og tilføj den til UI dropdown
            register(key, engine) {
                this.engines[key] = engine;
                console.log(`[Scanner-Manager] Motor registreret: ${engine.name} (${key})`);
                
                // Tilføj motoren som en valgmulighed i dropdown-menuen
                const option = document.createElement('option');
                option.value = key;
                option.textContent = engine.name;
                engineSelect.appendChild(option);

                if (!this.activeEngineKey) this.setEngine(key); // Sæt første registrerede motor som standard
            },

            // Skift den aktive motor
            setEngine(key) {
                if (this.engines[key]) {
                    this.activeEngineKey = key;
                    engineSelect.value = key;
                    console.log(`[Scanner-Manager] Aktiv motor skiftet til: ${this.engines[key].name}`);
                }
            },

            // Kør den aktive motor på det klippede zoomCanvas
            processFrame(zoomCanvasElement, zoomContext) {
                if (!this.activeEngineKey || !this.engines[this.activeEngineKey]) return;
                
                const currentEngine = this.engines[this.activeEngineKey];
                const imageData = zoomContext.getImageData(0, 0, zoomCanvasElement.width, zoomCanvasElement.height);
                
                currentEngine.scan(zoomCanvasElement, imageData);
            },

            // Hjælpefunktion som motorerne kan kalde for at udskrive resultatet på skærmen
            displayResult(text, isSuccess = true) {
                if (isSuccess) {
                    resultOutput.className = "alert alert-success mb-0 p-3 text-center fw-bold fs-5 shadow-sm animate__animated animate__fadeIn";
                    resultOutput.innerHTML = `<i class="bi bi-check-circle-fill me-2"></i>${text}`;
                } else {
                    resultOutput.className = "alert alert-secondary mb-0 p-3 text-center border-dashed font-monospace";
                    resultOutput.innerHTML = `<em>${text}</em>`;
                }
            }
        };

        // Lyt efter manuelle skift i dropdown-menuen
        engineSelect.addEventListener('change', (e) => {
            ScannerManager.setEngine(e.target.value);
        });

        // Ryd-knappen nulstiller resultatfeltet
        clearResultBtn.addEventListener('click', () => {
            ScannerManager.displayResult("Venter på scanning...", false);
        });
        // #endregion

         // #region KAMERA-LOGIK & STREAM STYRING
        function tick() {
            if (!isRunning) return;

            tickCounter++;

            if (video.readyState === video.HAVE_ENOUGH_DATA) {
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

                // Find centret af hoved-canvas baseret på CONFIG-størrelserne
                const sourceX = (canvas.width - CONFIG.targetWidth) / 2;
                const sourceY = (canvas.height - CONFIG.targetHeight) / 2;

                // Klip og forstør
                zoomCtx.drawImage(
                    canvas,
                    sourceX, sourceY, CONFIG.targetWidth, CONFIG.targetHeight,
                    0, 0, zoomCanvas.width, zoomCanvas.height
                );

                // Analyse-hook: Scanner hver 5. frame for at spare på CPU'en
                if (tickCounter % 5 === 0) {
                    ScannerManager.processFrame(zoomCanvas, zoomCtx);
                }
            } else {
                if (tickCounter % 60 === 0) {
                    console.warn(`[Kamera-Log] tick() venter på data. Status: ${video.readyState}`);
                }
            }

            window.requestAnimationFrame(tick);
        }

        async function startStream() {
            console.log("[Kamera-Log] Starter stream...");
            try {
                const constraints = {
                    video: {
                        facingMode: CONFIG.facingMode,
                        advanced: [{ torch: isTorchOn }]
                    }
                };

                mediaStream = await navigator.mediaDevices.getUserMedia(constraints);
                video.srcObject = mediaStream;
                await video.play();

                const tracks = mediaStream.getVideoTracks();
                if (tracks.length > 0) {
                    videoTrack = tracks[0];
                    console.log("[Kamera-Log] Aktivt videoTrack fundet:", videoTrack.label);
                }

                const capabilities = (videoTrack && videoTrack.getCapabilities) ? videoTrack.getCapabilities() : {};

                if (capabilities.torch) {
                    torchBtn.classList.remove('d-none');
                    updateTorchUI();
                } else {
                    console.log("[Kamera-Log] Torch understøttes ikke.");
                    torchBtn.classList.add('d-none');
                }

                isRunning = true;
                tickCounter = 0;

                startBtn.classList.add('d-none');
                stopBtn.classList.remove('d-none');
                scannerTarget.style.display = 'block';

                // Timer sat op via CONFIG
                autoStopTimer = setTimeout(() => {
                    console.log("[Kamera-Log] Timeout nået ud fra CONFIG.");
                    stopStream();
                }, CONFIG.autoStopTimeMS);

                window.requestAnimationFrame(tick);
            } catch (err) {
                console.error("[Kamera-Log] Fejl ved start:", err);
                alert("Kunne ikke starte videostream: " + err.message);
            }
        }

        async function toggleTorch() {
            if (!videoTrack || !isRunning) return;

            isTorchOn = !isTorchOn;

            try {
                await videoTrack.applyConstraints({
                    advanced: [{ torch: isTorchOn }]
                });
                updateTorchUI();
            } catch (err) {
                console.error("[Kamera-Log] Fejl ved ændring af lommelygte:", err);
                isTorchOn = !isTorchOn;
            }
        }

        function updateTorchUI() {
            if (isTorchOn) {
                torchIcon.className = "bi bi-lightbulb-fill text-dark";
                torchBtn.className = "btn btn-warning p-2 shadow-sm rounded-circle";
            } else {
                torchIcon.className = "bi bi-lightbulb text-secondary";
                torchBtn.className = "btn btn-dark p-2 shadow-sm rounded-circle";
            }
        }

        async function stopStream() {
            console.log("[Kamera-Log] Stopper stream...");
            isRunning = false;

            if (autoStopTimer) {
                clearTimeout(autoStopTimer);
                autoStopTimer = null;
            }
            if (videoTrack) {
                try {
                    await videoTrack.applyConstraints({ advanced: [{ torch: false }] });
                } catch (e) { }
                videoTrack.stop();
                videoTrack = null;
            }
            if (mediaStream) {
                mediaStream.getTracks().forEach(t => t.stop());
                mediaStream = null;
            }
            video.srcObject = null;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            zoomCtx.clearRect(0, 0, zoomCanvas.width, zoomCanvas.height);

            startBtn.classList.remove('d-none');
            stopBtn.classList.add('d-none');
            torchBtn.classList.add('d-none');
            scannerTarget.style.display = 'none';
        }

        startBtn.addEventListener('click', startStream);
        stopBtn.addEventListener('click', stopStream);
        torchBtn.addEventListener('click', toggleTorch);
        // #endregion

        // #region REELLE MOTOR-PLUGINS


       // Motor 1: Test/Lysstyrke Scanner
        ScannerManager.register('dummy', {
            name: "Lysstyrke Scanner (Test)",
            scan(canvasElement, imageData) {
                let totalBrightness = 0;
                const d = imageData.data;
                
                for (let i = 0; i < d.length; i += 4) {
                    totalBrightness += (d[i] + d[i+1] + d[i+2]) / 3;
                }
                
                const avg = Math.round(totalBrightness / (d.length / 4));
                
                // Opdaterer skærmen løbende med den målte værdi
                ScannerManager.displayResult(`Målt lysstyrke i feltet: ${avg} / 255`, true);
            }
        });

        // Motor 2: QR & Stregkode Scanner
        ScannerManager.register('barcode', {
            name: "Stregkode & QR-Scanner",
            async scan(canvasElement, imageData) {
                // Undersøg om browseren understøtter det indbyggede BarcodeDetector API
                if ('BarcodeDetector' in window) {
                    const detector = new BarcodeDetector({ 
                        formats: ['qr_code', 'ean_13', 'code_128', 'code_39'] 
                    });
                    
                    try {
                        const barcodes = await detector.detect(canvasElement);
                        if (barcodes.length > 0) {
                            console.log("[Barcode-Motor] Fundet:", barcodes.rawValue);
                            
                            // Vis resultatet på skærmen og stop kameraet automatisk ved fangst
                            ScannerManager.displayResult(barcodes.rawValue, true);
                            stopStream();
                        }
                    } catch (err) {
                        // Løbende fejl under scanning ignoreres for flydende oplevelse
                    }
                } else {
                    // Hvis browseren ikke understøtter API'et endnu
                    if (tickCounter % 60 === 0) {
                        ScannerManager.displayResult("BarcodeDetector API understøttes ikke i denne browser.", false);
                    }
                }
            }
        });

        // Motor 3: Kontrast-måler (Forberedelse til OCR)
        ScannerManager.register('contrast', {
            name: "Kontrast-måler (OCR Tjek)",
            scan(canvasElement, imageData) {
                const d = imageData.data;
                let minPix = 255;
                let maxPix = 0;

                // Gennemløb pixlerne i zoom-feltet for at finde max og min lysstyrke
                for (let i = 0; i < d.length; i += 4) {
                    const brightness = (d[i] + d[i+1] + d[i+2]) / 3;
                    if (brightness < minPix) minPix = brightness;
                    if (brightness > maxPix) maxPix = brightness;
                }

                // Kontrasten er forskellen mellem den lyseste og mørkeste pixel
                const contrast = Math.round(maxPix - minPix);
                const isContrastOk = contrast >= CONFIG.minContrast;

                // Vis status på skærmen baseret på om kontrasten godkendes til OCR
                if (isContrastOk) {
                    ScannerManager.displayResult(`Kontrast: ${contrast} (Godkendt til OCR &checkmark;)`, true);
                } else {
                    // Vi sender 'false' som andet argument, så feltet bliver gråt/neutralt som advarsel
                    ScannerManager.displayResult(`Kontrast: ${contrast} (For lav! Minimum er ${CONFIG.minContrast})`, false);
                }
            }
        });

        // Definer hvilken motor der skal være aktiv som standard ved indlæsning
        ScannerManager.setEngine('contrast');
        


        // #endregion





</script>

</body>

</html>
