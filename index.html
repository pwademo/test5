<!DOCTYPE html>
<html lang="da">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi purpose scanner</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

            position: absolute;

<body class="bg-light">

    <div class="container py-4">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">

                <!-- NYT KORT: Vælg Scannings-motor -->
                <div class="card shadow mb-4">
                    <div class="card-body p-3">
                        <label for="engineSelect" class="form-label fw-bold small text-secondary text-uppercase mb-2">
                            <i class="bi bi-gear-wide-connected me-1"></i> Vælg Scannings-motor
                        </label>
                        <select id="engineSelect" class="form-select form-select-lg border-primary shadow-sm">
                            <!-- Option-elementer genereres dynamisk via JavaScript -->
                        </select>
                    </div>
                </div>

                <!-- 1. Hovedkort: Video Stream -->
                <div class="card shadow mb-4">
                    <div class="card-header bg-primary text-white text-center py-3">
                        <h1 class="h4 mb-0"><i class="bi bi-camera-video-fill me-2"></i>Video Stream på Canvas</h1>
                    </div>

                    <div class="card-body p-3 text-center">
                        <div class="canvas-container mb-4">
                            <canvas id="canvas" width="640" height="480"
                                class="rounded border border-secondary shadow-sm"></canvas>
                            <div id="scannerTarget" class="scanner-target"></div>
                        </div>

                        <div class="d-flex flex-wrap justify-content-center align-items-center gap-3">
                            <button id="startBtn" class="btn btn-success px-4 py-2 shadow-sm">
                                <i class="bi bi-play-fill me-1"></i> Start
                            </button>

                            <button id="stopBtn" class="btn btn-danger px-4 py-2 shadow-sm d-none">
                                <i class="bi bi-stop-fill me-1"></i> Stop
                            </button>

                            <button id="torchBtn" class="btn btn-dark p-2 d-none shadow-sm rounded-circle"
                                style="width: 42px; height: 42px;" title="Lommelygte">
                                <i id="torchIcon" class="bi bi-lightbulb"></i>
                            </button>
                        </div>
                    </div>
                </div>

                <!-- 2. Kort: Forstørret Scanner-felt -->
                <div class="card shadow border-danger mb-4">
                    <div class="card-header bg-danger text-white text-center py-2">
                        <h2 class="h5 mb-0"><i class="bi bi-zoom-in me-2"></i>Forstørret Scanner-felt</h2>
                    </div>
                    <div class="card-body p-3 text-center bg-dark rounded-bottom">
                        <canvas id="zoomCanvas" class="rounded border border-light shadow-sm"></canvas>
                    </div>
                </div>

                <!-- NYT KORT: Scanningsresultat -->
                <div class="card shadow border-success">
                    <div
                        class="card-header bg-success text-white py-2 d-flex justify-content-between align-items-center">
                        <h2 class="h5 mb-0"><i class="bi bi-qr-code-scan me-2"></i>Scanningsresultat</h2>
                        <button id="clearResultBtn" class="btn btn-sm btn-outline-light py-0 px-2"
                            style="font-size: 0.8rem;">
                            <i class="bi bi-trash3-fill"></i> Ryd
                        </button>
                    </div>
                    <div class="card-body p-3 bg-white rounded-bottom">
                        <div id="resultOutput"
                            class="alert alert-secondary mb-0 p-3 text-center border-dashed font-monospace"
                            style="border: 2px dashed #dee2e6; min-height: 60px;">
                            <em>Venter på scanning...</em>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <video id="video" autoplay playsinline style="display:none;"></video>

        // #region CONFIG & VARIABLER
        const CONFIG = {
            mainCanvasWidth: 640,
            mainCanvasHeight: 360,
            targetWidth: 200,
            targetHeight: 30,
            zoomFactor: 2.5,
            autoStopTimeMS: 120000,
            facingMode: 'environment',
            minContrast: 40,         // Minimum acceptabel kontrast (0-255)
            blurThreshold: 25,
            useContrastCheck: false,   // Central kontrast-validering til/fra
            uficodepattern: /([[ACDEFGHJKLMNPQRSTUVWXY0-9][ACDEFGHJKLMNPQRSTUVWXY0-9]{3})-([ACDEFGHJKLMNPQRSTUVWXY0-9]{4})-([ACDEFGHJKLMNPQRSTUVWXY0-9]{4})-([ACDEFGHJKLMNPQRTUVWXY0-9]{4})/g

        };

        console.log("[Kamera-Log] Scriptet er indlæst med CONFIG:", CONFIG);

        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        const zoomCanvas = document.getElementById('zoomCanvas');
        const zoomCtx = zoomCanvas.getContext('2d', { willReadFrequently: true });
        const scannerTarget = document.getElementById('scannerTarget');

        const startBtn = document.getElementById('startBtn');
        const stopBtn = document.getElementById('stopBtn');
        const torchBtn = document.getElementById('torchBtn');
        const torchIcon = document.getElementById('torchIcon');

        const engineSelect = document.getElementById('engineSelect');
        const resultOutput = document.getElementById('resultOutput');
        const clearResultBtn = document.getElementById('clearResultBtn');

        let mediaStream = null;
        let videoTrack = null;
        let isRunning = false;
        let isTorchOn = false;
        let autoStopTimer = null;
        let tickCounter = 0;

        let tesseractWorker = null;

        canvas.width = CONFIG.mainCanvasWidth;
        canvas.height = CONFIG.mainCanvasHeight;

        scannerTarget.style.width = ((CONFIG.targetWidth / CONFIG.mainCanvasWidth) * 100) + '%';
        scannerTarget.style.height = ((CONFIG.targetHeight / CONFIG.mainCanvasHeight) * 100) + '%';

        zoomCanvas.width = CONFIG.targetWidth * CONFIG.zoomFactor;
        zoomCanvas.height = CONFIG.targetHeight * CONFIG.zoomFactor;
        // #endregion

        // #region SCANNER MANAGER (MOTOR-STYRING MED CENTRAL KONTRAST)
        const ScannerManager = {
            engines: {},
            activeEngineKey: null,

            register(key, engine) {
                this.engines[key] = engine;
                console.log(`[Scanner-Manager] Motor registreret: ${engine.name} (${key})`);

                const option = document.createElement('option');
                option.value = key;
                option.textContent = engine.name;
                engineSelect.appendChild(option);

                if (!this.activeEngineKey) this.setEngine(key);
            },

            setEngine(key) {
                if (this.engines[key]) {
                    this.activeEngineKey = key;
                    engineSelect.value = key;
                    console.log(`[Scanner-Manager] Aktiv motor skiftet til: ${this.engines[key].name}`);
                }
            },

            async processFrame(zoomCanvasElement, zoomContext) {
                if (!this.activeEngineKey || !this.engines[this.activeEngineKey]) return;

                const currentEngine = this.engines[this.activeEngineKey];
                if (currentEngine.isProcessing) return;

                const imageData = zoomContext.getImageData(0, 0, zoomCanvasElement.width, zoomCanvasElement.height);

                // CENTRAL KONTRAST-VALIDERING
                if (CONFIG.useContrastCheck) {
                    const contrastValue = this.beregnKontrast(imageData);
                    if (contrastValue < CONFIG.minContrast) {
                        if (tickCounter % 20 === 0) {
                            this.displayResult(`Scanning på pause: For lav kontrast (${contrastValue} < ${CONFIG.minContrast})`, false);
                        }
                        return; // AFBRYDER SCANNINGEN HER
                    }
                }

                try {
                    await currentEngine.scan(zoomCanvasElement, imageData);
                } catch (error) {
                    console.error(`[Scanner-Manager] Fejl under scanning med ${this.activeEngineKey}:`, error);
                }
            },

            beregnKontrast(imageData) {
                const d = imageData.data;
                let minPix = 255;
                let maxPix = 0;
                for (let i = 0; i < d.length; i += 4) {
                    const brightness = (d[i] + d[i + 1] + d[i + 2]) / 3;
                    if (brightness < minPix) minPix = brightness;
                    if (brightness > maxPix) maxPix = brightness;
                }
                return Math.round(maxPix - minPix);
            },

            displayResult(text, isSuccess = true) {
                if (isSuccess) {
                    resultOutput.className = "alert alert-success mb-0 p-3 text-center fw-bold fs-5 shadow-sm";
                    resultOutput.innerHTML = `<i class="bi bi-check-circle-fill me-2"></i>${text}`;
                } else {
                    resultOutput.className = "alert alert-secondary mb-0 p-3 text-center border-dashed font-monospace";
                    resultOutput.innerHTML = `<em>${text}</em>`;
                }
            }
        };

        engineSelect.addEventListener('change', (e) => {
            ScannerManager.setEngine(e.target.value);
        });

        clearResultBtn.addEventListener('click', () => {
            ScannerManager.displayResult("Venter på scanning...", false);
        });
        // #endregion

        // #region KAMERA & BILLED-LOOP LOGIK
        async function startStream() {
            if (isRunning) return;

            try {
                const constraints = {
                    video: {
                        facingMode: CONFIG.facingMode,
                        width: { ideal: CONFIG.mainCanvasWidth },
                        height: { ideal: CONFIG.mainCanvasHeight }
                    },
                    audio: false
                };

                mediaStream = await navigator.mediaDevices.getUserMedia(constraints);
                video.srcObject = mediaStream;

                video.onloadedmetadata = () => {
                    video.play();
                    isRunning = true;
                    tickCounter = 0;

                    startBtn.classList.add('d-none');
                    stopBtn.classList.remove('d-none');

                    videoTrack = mediaStream.getVideoTracks();
                    checkTorchSupport(videoTrack);

                    requestAnimationFrame(scanLoop);

                    autoStopTimer = setTimeout(() => {
                        stopStream();
                        ScannerManager.displayResult("Scanneren stoppede automatisk efter timeout.", false);
                    }, CONFIG.autoStopTimeMS);
                };

            } catch (err) {
                console.error("[Kamera-Log] Kunne ikke starte kameraet:", err);
                ScannerManager.displayResult("Kamerafejl: Kontroller adgangstilladelser.", false);
            }
        }

        function stopStream() {
            if (!isRunning) return;

            if (autoStopTimer) clearTimeout(autoStopTimer);

            if (mediaStream) {
                mediaStream.getTracks().forEach(track => track.stop());
            }

            isTorchOn = false;
            torchBtn.classList.add('d-none');
            torchIcon.className = "bi bi-lightbulb";

            isRunning = false;
            videoTrack = null;
            mediaStream = null;

            startBtn.classList.remove('d-none');
            stopBtn.classList.add('d-none');
            scannerTarget.style.display = 'none';
        }

        async function checkTorchSupport(track) {
            try {
                const capabilities = track.getCapabilities();
                if (capabilities.torch) {
                    torchBtn.classList.remove('d-none');
                } else {
                    torchBtn.classList.add('d-none');
                }
            } catch (e) {
                torchBtn.classList.add('d-none');
            }
        }

        async function toggleTorch() {
            if (!videoTrack || !isRunning) return;

            try {
                isTorchOn = !isTorchOn;
                await videoTrack.applyConstraints({
                    advanced: [{ torch: isTorchOn }]
                });
                torchIcon.className = isTorchOn ? "bi bi-lightbulb-fill text-warning" : "bi bi-lightbulb";
            } catch (err) {
                console.error("[Kamera-Log] Fejl ved styring af lommelygte:", err);
            }
        }

        function scanLoop() {
            if (!isRunning) return;

            tickCounter++;

            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            scannerTarget.style.display = 'block';

            const sourceX = (canvas.width - CONFIG.targetWidth) / 2;
            const sourceY = (canvas.height - CONFIG.targetHeight) / 2;

            zoomCtx.drawImage(
                canvas,
                sourceX, sourceY, CONFIG.targetWidth, CONFIG.targetHeight,
                0, 0, zoomCanvas.width, zoomCanvas.height
            );

            ScannerManager.processFrame(zoomCanvas, zoomCtx);

            requestAnimationFrame(scanLoop);
        }

        startBtn.addEventListener('click', startStream);
        stopBtn.addEventListener('click', stopStream);
        torchBtn.addEventListener('click', toggleTorch);

        // #region REELLE MOTOR-PLUGINS

        // #region MOTOR 1: LYSSTYRKE SCANNER
        ScannerManager.register('dummy', {
            name: "Lysstyrke Scanner (Test)",
            scan(canvasElement, imageData) {
                let totalBrightness = 0;
                const d = imageData.data;
                for (let i = 0; i < d.length; i += 4) {
                    totalBrightness += (d[i] + d[i + 1] + d[i + 2]) / 3;
                }
                const avg = Math.round(totalBrightness / (d.length / 4));
                ScannerManager.displayResult(`Målt lysstyrke i feltet: ${avg} / 255`, true);
            }
        });
        // #endregion

        // #region MOTOR 2: STREGKODE & QR-SCANNER
        ScannerManager.register('barcode', {
            name: "Stregkode & QR-Scanner",
            async scan(canvasElement, imageData) {
                if ('BarcodeDetector' in window) {
                    const detector = new BarcodeDetector({
                        formats: ['qr_code', 'ean_13', 'code_128', 'code_39']
                    });
                    try {
                        const barcodes = await detector.detect(canvasElement);
                        if (barcodes.length > 0) {
                            const codeValue = barcodes.rawValue;
                            ScannerManager.displayResult(codeValue, true);
                            if (typeof stopStream === "function") stopStream();
                        }
                    } catch (err) {
                        console.error("[Barcode-Motor] Detekteringsfejl:", err);
                    }
                } else {
                    if (tickCounter % 60 === 0) {
                        ScannerManager.displayResult("BarcodeDetector API understøttes ikke.", false);
                    }
                }
            }
        });
        // #endregion

        // #region MOTOR 3: KONTRAST-MÅLER
        ScannerManager.register('contrast', {
            name: "Kontrast-måler (OCR Tjek)",
            scan(canvasElement, imageData) {
                const contrast = ScannerManager.beregnKontrast(imageData);
                const isContrastOk = contrast >= CONFIG.minContrast;

                if (isContrastOk) {
                    ScannerManager.displayResult(`Kontrast: ${contrast} (Godkendt &checkmark;)`, true);
                } else {
                    ScannerManager.displayResult(`Kontrast: ${contrast} (For lav! Minimum: ${CONFIG.minContrast})`, false);
                }
            }
        });
        // #endregion

        // #region MOTOR 4: UFI OCR-SCANNER
        ScannerManager.register('ufi_ocr', {
            name: "UFI Kode OCR-Scanner",
            isProcessing: false,

            async init() {
                if (tesseractWorker) return;
                console.log("[OCR-Motor] Initialiserer Tesseract lynhurtig Worker med Init-only parametre...");

                // LØSNING: Init-only parametre skal sendes med som det 3. argument i createWorker!
                tesseractWorker = await Tesseract.createWorker('eng', 1, {
                    config: {
                        tessedit_ocr_engine_mode: '1', // Kør udelukkende den lynhurtige LSTM motor
                        load_system_dawg: '0',        // Slå system-ordbog helt fra under indlæsning
                        load_freq_dawg: '0'            // Slå frekvens-ordbog helt fra under indlæsning
                    }
                });

                // Almindelige parametre, der godt må ændres efter initialisering
                await tesseractWorker.setParameters({
                    tessedit_pageseg_mode: 7, // SINGLE_LINE (Læs billedet som én enkelt tekstlinje)
                    tessedit_char_whitelist: '0123456789ACDEFGHJKMNPQRSTUVWXY-:"',
                    textord_min_xheight: '8',
                    preserve_interword_spaces: '0'
                });
                console.log("[OCR-Motor] Optimeret worker er klar.");
            },

            async scan(canvasElement, imageData) {
                if (!tesseractWorker) {
                    await this.init();
                }

                try {
                    this.isProcessing = true;
                    if (tickCounter % 15 === 0) {
                        ScannerManager.displayResult("Analyserer UFI-felt lynhurtigt...", false);
                    }

                    const { data: { text } } = await tesseractWorker.recognize(canvasElement);
                    const cleanText = text.replace(/[^0-9A-Z-]/gi, '').toUpperCase();

                    // Regex uden indre parenteser, så den bare fanger hele den rå kode ud i én streng
                    const ufiRegex = CONFIG.uficodepattern;
                    const match = cleanText.match(ufiRegex);

                    if (match) {
                        // RETTELSE: Vi tager match[0] for at få den rene tekststreng ud af arrayet!
                        const fundetUfiStreng = match[0];

                        console.log(`%c[OCR-Regex-Match] Fandt mønster: ${fundetUfiStreng}`, 'color: #007bff; font-weight: bold;');

                        // Nu modtager funktionen en rigtig tekststreng og kan lave sin længdekontrol korrekt
                        if (this.validerUFIkode(fundetUfiStreng)) {
                            console.log(`%c[OCR-Validering] SUCCES! Godkendt: ${fundetUfiStreng}`, 'color: #28a745; font-weight: bold;');
                            ScannerManager.displayResult(`UFI: ${fundetUfiStreng}`, true);
                            if (typeof stopStream === "function") stopStream();
                        } else {
                            if (tickCounter % 5 === 0) {
                                ScannerManager.displayResult("UFI fundet, men afvist af format-validering...", false);
                            }
                        }
                    } else {
                        if (tickCounter % 30 === 0 && cleanText.length > 0) {
                            console.log("[OCR-Motor] Ingen Regex match på rå tekst:", cleanText);
                        }
                    }
                } catch (err) {
                    console.error("[OCR-Motor] Fejl under OCR-scanning:", err);
                } finally {
                    this.isProcessing = false;
                }
            },
            validerUFIkode(ufi) {

                // console.log(`%c  -> [Valider-Log] Starter tjek af: "${ufi}"`, 'color: #6c757d;');


                // if (!ufi || typeof ufi !== 'string') return false;

                // const renKode = ufi.replace(/-/g, '');

                //     return false;
                // }

                // console.log("%c  -> [Valider-Log] GODKENDT: Opfylder alle krav.", 'color: #28a745;');
                // return true;



                let ufino = ufi;

                //VAL001 ensures that the UFI is composed of 19 characters (including the hyphens and excluding spaces); 
                //Vi ved der er en korrekt formateret ufikode da den følger CONFIG.uficodepattern           

                let _ufino = ufino.replace(/-/g, "");//fjern alle bindestreger/hyphens


                //Validering af UFI kode som beskrevet i  UFI Developer Manual
                //Table 2-3 Base-31 character set viser lovlige karakterer og deres tilhørende talværdi
                //For at omsætte en karakter til et tal finder man karakterens index i nedenstående string
                //fx har karakter 8 index 8 og karakter C har index 11
                var repr = "0123456789ACDEFGHJKMNPQRSTUVWXY";

                var _sum = 0;

                //Alle de 16 karakterer løbes igennem.
                for (var i = 0; i < 16; i++) {
                    var reprChar = _ufino[i];//Char på plads nr. i
                    var ui = repr.indexOf(reprChar);//index og dermed værdien af Char på plads nr. i
                    _sum += (i + 1) * ui;
                }
                return _sum % 31 === 0;





            }
